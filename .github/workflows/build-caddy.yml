name: Build custom Caddy Docker image

on:
  workflow_dispatch:
    inputs:
      caddy_modules:
        description: 'Caddy modules to include (space-separated)'
        required: true
        default: 'github.com/caddy-dns/cloudflare github.com/greenpau/caddy-security github.com/mholt/caddy-l4'
      docker_image_name:
        description: 'Docker image name'
        required: true
        default: 'caddy-test'
      caddy_version:
        description: 'Caddy version to build'
        required: false
        default: 'latest'

concurrency:
  group: caddy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve-versions:
    name: 'Resolve base versions'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      caddy_version: ${{ steps.caddy.outputs.version }}
      caddy_full_tag: ${{ steps.caddy.outputs.full_tag }}
      caddy_base_version: ${{ steps.base.outputs.base_version }}
      bypass_mode: ${{ steps.base.outputs.bypass_mode }}
      alpine_version: ${{ steps.alpine.outputs.version }}
      modules: ${{ steps.validate.outputs.modules }}
    steps:
      - name: 'Get selected Caddy release'
        id: caddy
        env:
          INPUT_VERSION: ${{ inputs.caddy_version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API=https://api.github.com/repos/caddyserver/caddy/releases

          if [ -z "$INPUT_VERSION" ] || [ "$INPUT_VERSION" = "latest" ]; then
            LATEST_TAG=$(curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${API}/latest" | jq -er .tag_name)
          else
            VERSION="${INPUT_VERSION#v}"
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid Caddy version: $INPUT_VERSION" >&2
              exit 1
            fi
            LATEST_TAG="v${VERSION}"
            curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${API}/tags/${LATEST_TAG}" | jq -er .tag_name >/dev/null
          fi

          VERSION="${LATEST_TAG#v}"
          echo "Selected Caddy release: ${LATEST_TAG}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "full_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"

      - name: 'Validate module input'
        id: validate
        env:
          MODULES: ${{ inputs.caddy_modules }}
        run: |
          set -euo pipefail
          if ! [[ "$MODULES" =~ ^[A-Za-z0-9._/-]+(@[A-Za-z0-9._+-]+)?([[:blank:]]+[A-Za-z0-9._/-]+(@[A-Za-z0-9._+-]+)?)*$ ]]; then
            echo "::error::Incorrect module list: '$MODULES'."
            echo "::error::Space-separated list expected."
            exit 1
          fi
          echo "Module list accepted: $MODULES"
          echo "modules=$MODULES" >> "$GITHUB_OUTPUT"

      - name: 'Resolve Docker Hub base image version'
        id: base
        env:
          TARGET_VERSION: ${{ steps.caddy.outputs.version }}
          # TODO: Change after v3 release or fallback will find only v2.x
          MAJOR: "2"
        run: |
          set -uo pipefail
          DH_API="https://hub.docker.com/v2/repositories/library/caddy/tags"

          if curl -fsSL "${DH_API}/${TARGET_VERSION}-alpine" >/dev/null 2>&1 && \
             curl -fsSL "${DH_API}/${TARGET_VERSION}-builder-alpine" >/dev/null 2>&1; then
            echo "caddy:${TARGET_VERSION}-alpine and builder tag available"
            BASE_VERSION="${TARGET_VERSION}"
            BYPASS_MODE=false
          else
            echo "caddy:${TARGET_VERSION} tags are unavailable; selecting the newest published Alpine pair"
            CANDIDATES=$(curl -fsSL "${DH_API}?page_size=100&name=${MAJOR}." \
              | jq -r '.results[].name | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+-alpine$"))' \
              | sed 's/-alpine$//' | sort -V -r)

            BASE_VERSION=""
            while IFS= read -r candidate; do
              [ -n "$candidate" ] || continue
              if curl -fsSL "${DH_API}/${candidate}-builder-alpine" >/dev/null 2>&1 && \
                 curl -fsSL "${DH_API}/${candidate}-alpine" >/dev/null 2>&1; then
                BASE_VERSION="$candidate"
                break
              fi
            done <<< "$CANDIDATES"

            if [ -z "$BASE_VERSION" ]; then
              echo "::error::Docker Hub API unavailable or no published tags ${MAJOR}.x.y-builder-alpine found."
              exit 1
            fi
            BYPASS_MODE=true
          fi

          if [ "$BYPASS_MODE" = "true" ]; then
            echo "::warning::Base image fell back to caddy:${BASE_VERSION}. The binary version will be ${TARGET_VERSION}, but compiled with the ${BASE_VERSION} Go toolchain."
          fi

          echo "Resolved base version: ${BASE_VERSION}"
          echo "base_version=${BASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "bypass_mode=${BYPASS_MODE}" >> "$GITHUB_OUTPUT"

      - name: 'Resolve Alpine version'
        id: alpine
        env:
          TARGET_VERSION: ${{ steps.caddy.outputs.version }}
          BASE_VERSION: ${{ steps.base.outputs.base_version }}
          FALLBACK_ALPINE: "3.24.4"
        run: |
          set -uo pipefail
          ACC="Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json"
          TOK=$(curl -fsSL "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/caddy:pull" | jq -er .token)

          alpine_of() { # $1 = caddy version
            local dig cfg
            dig=$(curl -fsSL -H "Authorization: Bearer $TOK" -H "$ACC" \
              "https://registry-1.docker.io/v2/library/caddy/manifests/$1-alpine" \
              | jq -er '.manifests[] | select(.platform.architecture=="amd64" and .platform.os=="linux" and (.platform.variant==null)) | .digest') || return 1
            cfg=$(curl -fsSL -H "Authorization: Bearer $TOK" \
              "https://registry-1.docker.io/v2/library/caddy/blobs/$dig" | jq -er .config.digest) || return 1
            curl -fsSL -H "Authorization: Bearer $TOK" \
              "https://registry-1.docker.io/v2/library/caddy/blobs/$cfg" \
              | jq -er '[.history[].created_by] | map(select(test("alpine-minirootfs-"))) | .[0] | capture("alpine-minirootfs-(?<v>[0-9]+\\.[0-9]+\\.[0-9]+)") | .v'
          }

          VER="$(alpine_of "$TARGET_VERSION")" || VER=""
          [ -n "$VER" ] || VER="$(alpine_of "$BASE_VERSION")" || VER=""
          if [ -n "$VER" ]; then
            echo "Official caddy:${TARGET_VERSION}-alpine built on Alpine ${VER}"
          else
            VER="$FALLBACK_ALPINE"
            echo "::warning::Could not read the official image config, using fallback Alpine ${VER}."
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: 'Build and push'
    needs: resolve-versions
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      CADDY_VERSION_TAG: ${{ needs.resolve-versions.outputs.caddy_version }}
      CADDY_VERSION_FULL: ${{ needs.resolve-versions.outputs.caddy_full_tag }}
      CADDY_BASE_TAG: ${{ needs.resolve-versions.outputs.caddy_base_version }}
      BYPASS_MODE: ${{ needs.resolve-versions.outputs.bypass_mode }}
      DOCKER_IMAGE: ${{ vars.DOCKERHUB_LOGIN }}/${{ inputs.docker_image_name }}
      CADDY_ALPINE_VERSION: ${{ needs.resolve-versions.outputs.alpine_version }}
      MODULES: ${{ needs.resolve-versions.outputs.modules }}
      CACHE_SCOPE: caddy-${{ needs.resolve-versions.outputs.caddy_version }}-${{ github.ref_name }}
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v5

      - name: 'Setup QEMU'
        uses: docker/setup-qemu-action@v4

      - name: 'Setup Docker Buildx'
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: 'Login to Docker Hub'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: 'Build and push Caddy image'
        id: build
        uses: docker/build-push-action@v7
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          file: ./Dockerfile
          pull: true
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ env.CADDY_VERSION_TAG }}-alpine
            ${{ env.DOCKER_IMAGE }}:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }},ignore-error=true
          build-args: |
            CADDY_TARGET_VERSION=${{ env.CADDY_VERSION_TAG }}
            CADDY_BUILDER_REF=caddy:${{ env.CADDY_BASE_TAG }}-builder-alpine
            CADDY_RUNTIME_REF=alpine:${{ env.CADDY_ALPINE_VERSION }}
            CADDY_MODULES=${{ env.MODULES }}
          sbom: true
          provenance: mode=min

      - name: 'Summary'
        if: '!cancelled()'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: |-
            ${{ env.DOCKER_IMAGE }}:${{ env.CADDY_VERSION_TAG }}-alpine
            ${{ env.DOCKER_IMAGE }}:latest
        run: |
          {
            if [ -z "$DIGEST" ]; then
              echo "## ❌ Caddy image build failed"
              echo
              echo "- **Caddy version:** \`${CADDY_VERSION_FULL}\`"
              echo "- **Image:** \`${DOCKER_IMAGE}\`"
              echo "- **Cache scope:** \`${CACHE_SCOPE}\`"
            else
              echo "## ✅ Caddy image build complete"
              echo
              echo "- **Caddy version:** \`${CADDY_VERSION_FULL}\`"
              echo "- **Image:** \`${DOCKER_IMAGE}\`"
              if [ "$BYPASS_MODE" = "true" ]; then
                echo "- **Base:** \`caddy:${CADDY_BASE_TAG}-builder-alpine\` / \`caddy:${CADDY_BASE_TAG}-alpine\`"
              fi
              echo "- **Digest:** \`${DIGEST}\`"
              echo "- **Cache scope:** \`${CACHE_SCOPE}\`"
              echo "- **Tags:**"
              printf '%s\n' "$TAGS" | sed 's/^/  - `/' | sed 's/$/`/'
              echo
              echo "- **Modules included:**"
              echo
              MODS="$(docker run --rm --entrypoint caddy "${DOCKER_IMAGE}:${CADDY_VERSION_TAG}-alpine" \
                        list-modules --versions --packages --skip-standard 2>/dev/null \
                      | sed 's/^[[:space:]]*//' | grep -v '^$' | grep -v 'modules:' | sort -u)" || MODS=""
              if [ -n "$MODS" ]; then
                echo "| Module | Version | Modules |"
                echo "|:--|:--|--:|"
                printf '%s\n' "$MODS" | awk 'NF>=3 {print $3" "$2}' | sort | uniq -c \
                | awk '{printf "| `%s` | `%s` | %d |\n", $2, $3, $1}'
                echo
                printf 'Non-standard modules: `%s`, unique Go-packages: `%s`\n' \
                "$(printf '%s\n' "$MODS" | awk 'NF>=3' | wc -l | tr -d ' ')" \
                "$(printf '%s\n' "$MODS" | awk 'NF>=3 {print $3" "$2}' | sort -u | wc -l | tr -d ' ')"
              else
                echo "Failed to get modules"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  scan:
    name: 'Vulnerability scan'
    needs: build-and-push
    if: always() && needs.build-and-push.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCKER_IMAGE: ${{ vars.DOCKERHUB_LOGIN }}/${{ inputs.docker_image_name }}
    steps:
      - name: 'Trivy scan'
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: ${{ env.DOCKER_IMAGE }}@${{ needs.build-and-push.outputs.digest }}
          format: 'json'
          output: 'trivy-official.json'
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: '0'

      - name: 'Scan summary'
        if: always()
        continue-on-error: true
        run: |
          cat > .trivy-report.jq <<'JQEOF'
          def sev_badge:
            if   . == "CRITICAL" then "🔴 CRITICAL"
            elif . == "HIGH"     then "🟠 HIGH"
            elif . == "MEDIUM"   then "🟡 MEDIUM"
            elif . == "LOW"      then "🔵 LOW"
            else "⚪ " + . end;

          def cell: gsub("\\|"; "/") | gsub("\n"; " ");
          def sev_rank: if . == "CRITICAL" then 0 elif . == "HIGH" then 1 elif . == "MEDIUM" then 2 elif . == "LOW" then 3 else 4 end;

          [ .Results[]? as $r
            | ($r.Vulnerabilities // [])[]
            | . + { __class: ($r.Class // "unknown") }
          ] as $v
          | ($v | length) as $total
          | ($v | map(.Severity) | unique | sort_by(sev_rank)) as $seen
          | (
              if $total == 0 then
                "✅ No findings\n"
              else
                "**Total findings: \($total)**\n\n"
                + "| Severity | Found |\n|:--|--:|\n"
                + (reduce $seen[] as $s ("";
                    . + "| \($s | sev_badge) | \($v | map(select(.Severity == $s)) | length) |\n"))
                + "\n"
                + "| Severity | CVE | Package | Installed | Fixed in | Source |\n|:--|:--|:--|:--|:--|:--|\n"
                + ($v
                   | sort_by([ (.Severity | sev_rank), (.VulnerabilityID // ""), (.PkgName // "") ])
                   | .[:50]
                   | map("| \(.Severity | sev_badge) | \(.VulnerabilityID // "?" | cell) | \(.PkgName // "?" | cell) | \(.InstalledVersion // "?" | cell) | \(.FixedVersion // "-" | cell) | \(.__class | cell) |")
                   | join("\n"))
                + "\n"
                + (if $total > 50
                   then "\n_The first 50 of \($total) are shown. See more in scan logs_\n"
                   else "" end)
              end
            )
          JQEOF

          {
            echo "### 🛡️ Vulnerabilities"
            for pair in "trivy-official.json"; do
              f="${pair#*:}"
              echo ""
              if [ -s "$f" ] && jq -e . "$f" >/dev/null 2>&1; then
                jq -r -f .trivy-report.jq "$f" \
                  || echo "❌ jq failed to parse summary"
              else
                echo "❌ Scan failed"
              fi
              echo ""
            done
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
