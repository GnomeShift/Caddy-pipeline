name: Build custom Caddy Docker image

on:
  workflow_dispatch:
    inputs:
      caddy_modules:
        description: 'Caddy modules to include (space-separated)'
        required: true
        default: 'github.com/caddy-dns/cloudflare github.com/greenpau/caddy-security github.com/mholt/caddy-l4'
      docker_image_name:
        description: 'Docker image name'
        required: true
        default: 'caddy-test'
      caddy_version:
        description: 'Caddy version to build'
        required: false
        default: 'latest'

concurrency:
  group: caddy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve-versions:
    name: 'Resolve base versions'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      caddy_version: ${{ steps.caddy.outputs.version }}
      caddy_full_tag: ${{ steps.caddy.outputs.full_tag }}
      caddy_base_version: ${{ steps.base.outputs.base_version }}
      bypass_mode: ${{ steps.base.outputs.bypass_mode }}
    steps:
      - name: 'Get selected Caddy release'
        id: caddy
        env:
          INPUT_VERSION: ${{ inputs.caddy_version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API=https://api.github.com/repos/caddyserver/caddy/releases

          if [ -z "$INPUT_VERSION" ] || [ "$INPUT_VERSION" = "latest" ]; then
            LATEST_TAG=$(curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${API}/latest" | jq -er .tag_name)
          else
            VERSION="${INPUT_VERSION#v}"
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid Caddy version: $INPUT_VERSION" >&2
              exit 1
            fi
            LATEST_TAG="v${VERSION}"
            curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${API}/tags/${LATEST_TAG}" | jq -er .tag_name >/dev/null
          fi

          VERSION="${LATEST_TAG#v}"
          echo "Selected Caddy release: ${LATEST_TAG}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "full_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"

      - name: 'Validate module input'
        env:
          MODULES: ${{ inputs.caddy_modules }}
        run: |
          set -euo pipefail
          if ! [[ "$MODULES" =~ ^[A-Za-z0-9._/-]+([[:space:]]+[A-Za-z0-9._/-]+)*$ ]]; then
            echo "::error::Incorrect module list: '$MODULES'."
            echo "::error::Space-separated list expected."
            exit 1
          fi
          echo "Module list accepted: $MODULES"

      - name: 'Resolve Docker Hub base image version'
        id: base
        env:
          TARGET_VERSION: ${{ steps.caddy.outputs.version }}
          # TODO: Change after v3 release or fallback will find only v2.x
          MAJOR: "2"
        run: |
          set -uo pipefail
          DH_API="https://hub.docker.com/v2/repositories/library/caddy/tags"

          if curl -fsSL "${DH_API}/${TARGET_VERSION}-alpine" >/dev/null 2>&1 && \
             curl -fsSL "${DH_API}/${TARGET_VERSION}-builder-alpine" >/dev/null 2>&1; then
            echo "caddy:${TARGET_VERSION}-alpine and builder tag available"
            BASE_VERSION="${TARGET_VERSION}"
            BYPASS_MODE=false
          else
            echo "caddy:${TARGET_VERSION} tags are unavailable; selecting the newest published Alpine pair"
            CANDIDATES=$(curl -fsSL "${DH_API}?page_size=100&name=${MAJOR}." \
              | jq -r '.results[].name | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+-alpine$"))' \
              | sed 's/-alpine$//' | sort -V -r)

            BASE_VERSION=""
            while IFS= read -r candidate; do
              [ -n "$candidate" ] || continue
              if curl -fsSL "${DH_API}/${candidate}-builder-alpine" >/dev/null 2>&1 && \
                 curl -fsSL "${DH_API}/${candidate}-alpine" >/dev/null 2>&1; then
                BASE_VERSION="$candidate"
                break
              fi
            done <<< "$CANDIDATES"

            if [ -z "$BASE_VERSION" ]; then
              echo "::error::Docker Hub API unavailable or no published tags ${MAJOR}.x.y-builder-alpine found"
              exit 1
            fi
            BYPASS_MODE=true
          fi

          echo "Resolved base version: ${BASE_VERSION}"
          echo "base_version=${BASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "bypass_mode=${BYPASS_MODE}" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: 'Build and push'
    needs: resolve-versions
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      CADDY_VERSION_TAG: ${{ needs.resolve-versions.outputs.caddy_version }}
      CADDY_VERSION_FULL: ${{ needs.resolve-versions.outputs.caddy_full_tag }}
      CADDY_BASE_TAG: ${{ needs.resolve-versions.outputs.caddy_base_version }}
      BYPASS_MODE: ${{ needs.resolve-versions.outputs.bypass_mode }}
      DOCKER_IMAGE: ${{ vars.DOCKERHUB_LOGIN }}/${{ inputs.docker_image_name }}
      CADDY_ALPINE_VERSION: "3.23"
      CACHE_SCOPE: caddy-official
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v5

      - name: 'Setup QEMU'
        uses: docker/setup-qemu-action@v4

      - name: 'Setup Docker Buildx'
        id: buildx
        uses: docker/setup-buildx-action@v4

      - name: 'Login to Docker Hub'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: 'Build and push Caddy image'
        id: build
        uses: docker/build-push-action@v7
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          file: ./Dockerfile
          pull: true
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ env.CADDY_VERSION_TAG }}-alpine
            ${{ env.DOCKER_IMAGE }}:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }},ignore-error=true
          build-args: |
            CADDY_TARGET_VERSION=${{ env.CADDY_VERSION_TAG }}
            CADDY_BASE_VERSION=${{ env.CADDY_BASE_TAG }}
            CADDY_ALPINE_VERSION=${{ env.CADDY_ALPINE_VERSION }}
            CADDY_MODULES=${{ inputs.caddy_modules }}
          sbom: true
          provenance: mode=min

      - name: 'Summary'
        if: always()
        env:
          MODULES_INPUT: ${{ inputs.caddy_modules }}
        run: |
          {
            echo "## ✅ Caddy image build complete"
            echo ""
            echo "- **Caddy version:** \`${CADDY_VERSION_FULL}\`"
            echo "- **Image:** \`${DOCKER_IMAGE}\`"
            if [ "$BYPASS_MODE" = "true" ]; then
              echo "- **Base:** \`caddy:${CADDY_BASE_TAG}-builder-alpine\` / \`caddy:${CADDY_BASE_TAG}-alpine\`"
            fi
            echo "- **Tags:**"
            echo "  - \`${DOCKER_IMAGE}:${CADDY_VERSION_TAG}-alpine\`"
            echo "  - \`${DOCKER_IMAGE}:latest\`"
            echo "- **Modules included:**"
            echo ""
            printf '```\n'
            printf '%s\n' "$MODULES_INPUT" | tr ' ' '\n'
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

  scan:
    name: 'Vulnerability scan'
    needs: build-and-push
    if: always() && needs.build-and-push.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCKER_IMAGE: ${{ vars.DOCKERHUB_LOGIN }}/${{ inputs.docker_image_name }}
    steps:
      - name: 'Trivy scan'
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: ${{ env.DOCKER_IMAGE }}@${{ needs.build-and-push.outputs.digest }}
          format: 'json'
          output: 'trivy-official.json'
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: '0'

      - name: 'Scan summary'
        if: always()
        continue-on-error: true
        run: |
          cat > .trivy-report.jq <<'JQEOF'
          def sev_badge:
            if   . == "CRITICAL" then "🔴 CRITICAL"
            elif . == "HIGH"     then "🟠 HIGH"
            elif . == "MEDIUM"   then "🟡 MEDIUM"
            elif . == "LOW"      then "🔵 LOW"
            else "⚪ " + . end;

          def cell: gsub("\\|"; "/") | gsub("\n"; " ");
          def sev_rank: if . == "CRITICAL" then 0 elif . == "HIGH" then 1 elif . == "MEDIUM" then 2 elif . == "LOW" then 3 else 4 end;

          [ .Results[]? as $r
            | ($r.Vulnerabilities // [])[]
            | . + { __class: ($r.Class // "unknown") }
          ] as $v
          | ($v | length) as $total
          | ($v | map(select(.Severity == "CRITICAL" or .Severity == "HIGH")) | length) as $act
          | ($v | map(.Severity) | unique | sort_by(sev_rank)) as $seen
          | (
              if $total == 0 then
                "_No findings._\n"
              else
                "**Total findings: \($total)**\n\n"
                + "| Severity | Found |\n|:--|--:|\n"
                + (reduce $seen[] as $s ("";
                    . + "| \($s | sev_badge) | \($v | map(select(.Severity == $s)) | length) |\n"))
                + "\n"
                + "| Severity | CVE | Package | Installed | Fixed in | Source |\n|:--|:--|:--|:--|:--|:--|\n"
                + ($v
                   | sort_by([ (.Severity | sev_rank), (.VulnerabilityID // ""), (.PkgName // "") ])
                   | .[:50]
                   | map("| \(.Severity | sev_badge) | \(.VulnerabilityID // "?" | cell) | \(.PkgName // "?" | cell) | \(.InstalledVersion // "?" | cell) | \(.FixedVersion // "-" | cell) | \(.__class | cell) |")
                   | join("\n"))
                + "\n"
                + (if $total > 50
                   then "\n_The first 50 of \($total) are shown. See more in scan logs_\n"
                   else "" end)
              end
            )
          JQEOF

          {
            echo "### Vulnerabilities"
            for pair in "trivy-official.json"; do
              label="${pair%%:*}"
              f="${pair#*:}"
              echo "#### $label"
              echo ""
              if [ -s "$f" ] && jq -e . "$f" >/dev/null 2>&1; then
                jq -r -f .trivy-report.jq "$f" \
                  || echo "_jq failed to parse summary_"
              else
                echo "_Scan failed_"
              fi
              echo ""
            done
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
